<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin WashLabs</title>
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div class="admin-login-container">
    <h2>Login Admin</h2>

    <input type="password" id="adminPass" placeholder="Masukkan Password Admin">
    <button id="adminLogin">Login</button>

    <p id="adminStatus"></p>
  </div>

  <script>
    const ADMIN_PASSWORD = "washlabsadmin";

    document.getElementById("adminLogin").addEventListener("click", () => {
      const pass = document.getElementById("adminPass").value.trim();

      if (pass === ADMIN_PASSWORD) {
        localStorage.setItem("washlabs_admin_logged", "true");
        window.location.href = "dashboard.html"; // masuk dashboard admin
      } else {
        document.getElementById("adminStatus").textContent = "❌ Password salah!";
      }
    });
  </script>
</body>
</html>
