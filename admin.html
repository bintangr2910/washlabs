<script type="module">

import { getOrdersAdmin } from "./api/getOrdersAdmin.js";
import { addOrder } from "./api/addOrder.js";
import { updateStatus } from "./api/updateStatus.js";
import { deleteOrder } from "./api/deleteOrder.js";

async function loadOrders() {
    const data = await getOrdersAdmin();

    const table = document.getElementById("ordersTable");
    table.innerHTML = "";

    data.forEach(order => {
        table.innerHTML += `
            <tr>
                <td>${order.nama}</td>
                <td>${order.telpon}</td>
                <td>${order.barang}</td>
                <td>${order.jumlah}</td>

                <td>
                    <select onchange="changeStatus(${order.id}, this.value)">
                        <option ${order.status === "Menunggu Antrian" ? "selected" : ""}>Menunggu Antrian</option>
                        <option ${order.status === "Sedang Dicuci" ? "selected" : ""}>Sedang Dicuci</option>
                        <option ${order.status === "Selesai" ? "selected" : ""}>Selesai</option>
                    </select>
                </td>

                <td>
                    <button onclick="hapus(${order.id})">Hapus</button>
                </td>
            </tr>
        `;
    });
}

window.changeStatus = async function(id, status) {
    await updateStatus(id, status);
};

window.hapus = async function(id) {
    await deleteOrder(id);
    loadOrders();
};

window.addOrder = async function() {
    const nama = document.getElementById("nama").value;
    const telpon = document.getElementById("telpon").value;
    const barang = document.getElementById("barang").value;
    const jumlah = document.getElementById("jumlah").value;
    const status = document.getElementById("status").value;

    await addOrder(nama, telpon, barang, jumlah, status);
    loadOrders();
};

loadOrders();

</script>
