<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Admin Dashboard | WashLabs.ind</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="admin.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">WASHLABS.<span>ADMIN</span></a>
            <button id="logoutButton" class="btn" style="background-color: #ef4444; display: none;" onclick="handleLogout()">Logout</button>
        </nav>
    </header>

    <section class="section calculator" style="min-height: 80vh;">
        
        <div id="login-form" class="container" style="max-width: 400px; padding-top: 50px;">
            <h2 class="section-title">🔑 Admin Login</h2>
            <div class="calc-box">
                <label for="username">Username:</label>
                <input type="text" id="username" required autocomplete="off">
                
                <label for="password" style="margin-top: 15px;">Password:</label>
                <input type="password" id="password" required>
                
                <button id="loginButton" class="spin-btn" style="margin-top: 25px; width: 100%;" onclick="handleLogin()">Login</button>
                
                <p id="loginMessage" class="note" style="margin-top: 15px; color: #ef4444; display: none;"></p>
            </div>
        </div>

        <div id="admin-dashboard" class="container" style="display: none; max-width: 1200px;">
            <h2 class="section-title">📊 Dashboard Pesanan</h2>
            <p id="greeting" class="section-subtitle">Selamat datang, Admin!</p>
            
            <div class="calc-box" style="max-width: 800px; margin: 30px auto;">
                <h3>➕ Tambah Pesanan Baru</h3>
                <form id="addOrderForm" onsubmit="handleAddOrder(event)">
                    <label>Nama Pelanggan:</label>
                    <input type="text" name="nama" required>
                    
                    <label>Nomor Telepon:</label>
                    <input type="text" name="telepon" required>
                    
                    <label>Deskripsi Barang:</label>
                    <input type="text" name="barang" placeholder="Ex: Sepatu Canvas Putih, Helm Half Face" required>
                    
                    <label>Jumlah Item:</label>
                    <input type="number" name="jumlah" min="1" value="1" required>
                    
                    <button type="submit" class="spin-btn" style="margin-top: 20px;">Simpan Pesanan</button>
                </form>
            </div>

            <div style="margin-top: 50px; overflow-x: auto;">
                <table id="ordersTable" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: var(--accent); color: var(--primary);">
                            <th style="padding: 12px 15px;">ID</th>
                            <th style="padding: 12px 15px;">Nama</th>
                            <th style="padding: 12px 15px;">Telepon</th>
                            <th style="padding: 12px 15px;">Barang</th>
                            <th style="padding: 12px 15px;">Status</th>
                            <th style="padding: 12px 15px;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>© 2025 WashLabs.indonesia</p>
    </footer>

    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modalTitle">Konfirmasi</h3>
            <p id="modalMessage">Apakah Anda yakin?</p>
            <div class="modal-buttons">
                <button id="modalConfirmBtn" class="modal-btn confirm">Ya</button>
                <button id="modalCancelBtn" class="modal-btn cancel" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // KONFIGURASI SUPABASE
        const SUPABASE_URL = 'https://zfevxdhonsbxyybogjjd.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZXZ4ZGhvbnNieHl5Ym9nampkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0MTU0OTEsImV4cCI6MjA3ODk5MTQ5MX0.p95pmHVjYWL7L-0tx59Wyll6OP9mIsKdbUz1WRJ5P1k'; 
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Variabel Global
        let deleteId = null;
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        // --- 1. CEK LOGIN SAAT LOAD ---
        window.onload = function() {
            checkLogin();
        };

        function checkLogin() {
            if (localStorage.getItem('isAdminLoggedIn') === 'true') {
                showDashboard(true);
                loadOrders();
            } else {
                showDashboard(false);
            }
        }

        function showDashboard(show) {
            document.getElementById('login-form').style.display = show ? 'none' : 'block';
            document.getElementById('admin-dashboard').style.display = show ? 'block' : 'none';
            document.getElementById('logoutButton').style.display = show ? 'block' : 'none';
        }

        // --- 2. FUNGSI LOGIN (SUPPORT HP) ---
        async function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginButton');
            const msg = document.getElementById('loginMessage');
            
            msg.style.display = 'none';
            btn.innerText = "Loading...";
            btn.disabled = true; 

            try {
                const { data, error } = await _supabase
                    .from('admin')
                    .select('*')
                    .eq('username', u)
                    .single();

                // Login Darurat (Jika Database Error/Terkunci)
                if ((!data || error) && u === 'admin' && p === '123') {
                    alert("⚠️ Login Mode Offline/Darurat");
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    location.reload();
                    return;
                }

                if (data && data.password === p) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    location.reload();
                } else {
                    msg.textContent = "Username atau Password Salah!";
                    msg.style.display = 'block';
                }
            } catch (err) {
                // Pesan Error Lebih Detail
                let errorText = "Koneksi Error.";
                if(err.code === 'PGRST116') errorText = "Username tidak ditemukan (Cek Database).";
                
                msg.textContent = errorText;
                msg.style.display = 'block';
                console.error(err);
            } finally {
                btn.innerText = "Login";
                btn.disabled = false;
            }
        }

        // --- 3. FUNGSI LOGOUT ---
        function handleLogout() {
            localStorage.removeItem('isAdminLoggedIn');
            location.reload();
        }

        // --- 4. TAMBAH PESANAN ---
        async function handleAddOrder(e) {
            e.preventDefault();
            const form = document.getElementById('addOrderForm');
            const btn = form.querySelector('button');
            const oldText = btn.innerText;
            
            btn.disabled = true; 
            btn.innerText = "Menyimpan...";

            const formData = new FormData(form);
            const newId = Math.floor(100000 + Math.random() * 900000);

            const { error } = await _supabase.from('orders').insert([{
                id: newId,
                nama: formData.get('nama'),
                telepon: formData.get('telepon'),
                barang: formData.get('barang'),
                jumlah: formData.get('jumlah'),
                status: 'Antrian',
                create_at: new Date().toISOString()
            }]);

            btn.disabled = false; 
            btn.innerText = oldText;

            if (!error) {
                showCustomAlert(`✅ Sukses! ID: ${newId}`, 'Sukses');
                form.reset();
                loadOrders();
            } else {
                showCustomAlert(`Gagal: ${error.message}`, 'Error');
            }
        }

        // --- 5. MUAT DATA TABEL ---
        async function loadOrders() {
            const tbody = document.querySelector('#ordersTable tbody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Memuat Data...</td></tr>';

            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .order('create_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Gagal memuat (Cek RLS Database)</td></tr>`;
                return;
            }

            if (data && data.length > 0) {
                tbody.innerHTML = data.map(o => `
                    <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                        <td style="padding:12px;"><b>${o.id}</b></td>
                        <td style="padding:12px;">${o.nama}</td>
                        <td style="padding:12px;">${o.telepon}</td>
                        <td style="padding:12px;">${o.barang} (${o.jumlah})</td>
                        <td style="padding:12px; font-weight:bold; color:${o.status === 'Selesai' ? '#10b981' : o.status === 'Sedang Dicuci' ? '#facc15' : '#3b82f6'}">
                            ${o.status}
                        </td>
                        <td style="padding:12px; display: flex; align-items: center; gap: 5px; justify-content: center;">
                            <select onchange="updateStatus(${o.id}, this.value)" style="background:#222; color:#fff; padding:8px; border-radius:4px; border:1px solid #444; font-size:14px;">
                                <option value="Antrian" ${o.status === 'Antrian' ? 'selected' : ''}>Antrian</option>
                                <option value="Sedang Dicuci" ${o.status === 'Sedang Dicuci' ? 'selected' : ''}>Dicuci</option>
                                <option value="Selesai" ${o.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                            </select>
                            
                            <button onclick="confirmDelete(${o.id})" style="background:#ef4444; color:white; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-size:14px;">
                                🗑️
                            </button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Belum ada pesanan.</td></tr>';
            }
        }

        // --- 6. UPDATE & DELETE ---
        window.updateStatus = async (id, val) => {
            await _supabase.from('orders').update({ status: val }).eq('id', id);
            loadOrders();
        };

        // --- 7. MODAL LOGIC ---
        function showCustomAlert(message, title = 'Notifikasi') {
            modalTitle.innerText = title;
            modalMessage.innerText = message;
            modalConfirmBtn.innerText = 'OK';
            modalConfirmBtn.onclick = closeModal; 
            document.getElementById('modalCancelBtn').style.display = 'none';
            modal.style.display = 'flex';
        }

        function confirmDelete(id) {
            deleteId = id;
            modalTitle.innerText = 'Hapus Pesanan';
            modalMessage.innerText = `Yakin hapus ID ${id}?`;
            modalConfirmBtn.innerText = 'Ya, Hapus';
            document.getElementById('modalCancelBtn').style.display = 'inline-block';
            
            modalConfirmBtn.onclick = async function() {
                if (deleteId) {
                    const { error } = await _supabase.from('orders').delete().eq('id', deleteId);
                    if (!error) {
                        showCustomAlert("Data terhapus.", "Sukses");
                        loadOrders();
                    } else {
                        showCustomAlert("Gagal hapus: " + error.message, "Error");
                    }
                    deleteId = null;
                }
            };
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            deleteId = null;
        }

        
    </script>
</body>
</html>
