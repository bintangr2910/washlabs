<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - WashLabs</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginAdmin()">Masuk</button>

    <p id="msg"></p>
</div>

<!-- Import Supabase -->
<script type="module">
import { supabase } from "./supabase.js";

async function loginAdmin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
        document.getElementById("msg").textContent = "Harap isi semua field.";
        return;
    }

    // Cek tabel admin sesuai database Supabase
    const { data, error } = await supabase
        .from("admin")               // NAMA TABEL
        .select("*")
        .eq("username", username)    // KOLOM NAMA SESUAI TABEL
        .eq("password", password)    // KOLOM PASSWORD SESUAI TABEL
        .single();

    if (error || !data) {
        document.getElementById("msg").textContent = "Username atau password salah.";
        return;
    }

    // Simpan status login
    localStorage.setItem("admin_logged", "true");

    // Redirect ke admin dashboard
    window.location.href = "admin.html";
}

window.loginAdmin = loginAdmin; // supaya tombol bisa memanggil
</script>

</body>
</html>
