<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tes Koneksi Supabase</title>
    <style>
        body { font-family: monospace; background: #222; color: #fff; padding: 20px; }
        .box { padding: 20px; border: 1px solid #555; margin-bottom: 20px; border-radius: 8px; }
        .success { color: #4ade80; border-color: #4ade80; }
        .error { color: #ef4444; border-color: #ef4444; }
        .warning { color: #facc15; border-color: #facc15; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🔍 Diagnosa Koneksi Database</h1>
    <div id="status" class="box">Sedang mengecek...</div>

    <script>
        // 1. KONFIGURASI (Sama persis dengan script.js Anda)
        const SUPABASE_URL = 'https://zfevxdhonsbxyybogjjd.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZXZ4ZGhvbnNieHl5Ym9nampkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM0MTU0OTEsImV4cCI6MjA3ODk5MTQ5MX0.p95pmHVjYWL7L-0tx59Wyll6OP9mIsKdbUz1WRJ5P1k';

        async function checkConnection() {
            const statusDiv = document.getElementById('status');
            
            try {
                const { createClient } = supabase;
                const client = createClient(SUPABASE_URL, SUPABASE_KEY);
                
                // 2. COBA AMBIL DATA ADMIN
                const { data, error } = await client.from('admin').select('*');

                // 3. ANALISA HASIL
                if (error) {
                    // KASUS A: Koneksi Gagal / Error
                    statusDiv.className = "box error";
                    statusDiv.innerHTML = `
                        <h3>❌ KONEKSI GAGAL / ERROR</h3>
                        <p><strong>Pesan Error:</strong> ${error.message}</p>
                        <p><strong>Kemungkinan Penyebab:</strong> URL/Key salah, atau RLS (Keamanan) masih aktif.</p>
                    `;
                } else if (data.length === 0) {
                    // KASUS B: Terhubung, tapi data kosong
                    statusDiv.className = "box warning";
                    statusDiv.innerHTML = `
                        <h3>⚠️ TERHUBUNG TAPI DATA KOSONG</h3>
                        <p>Koneksi ke Supabase BERHASIL, tetapi tabel 'admin' tidak ada isinya.</p>
                        <p><strong>Solusi:</strong> Masuk ke Supabase SQL Editor dan jalankan perintah INSERT data admin lagi.</p>
                    `;
                } else {
                    // KASUS C: SUKSES TOTAL
                    const user = data[0];
                    statusDiv.className = "box success";
                    statusDiv.innerHTML = `
                        <h3>✅ KONEKSI SUKSES & DATA DITEMUKAN!</h3>
                        <p>Database terhubung dengan baik.</p>
                        <hr>
                        <p><strong>Data yang terbaca di Database:</strong></p>
                        <p>Username: <b>${user.username}</b></p>
                        <p>Password: <b>${user.password}</b></p>
                        <hr>
                        <p>Silakan gunakan Username & Password di atas (Persis!) untuk login.</p>
                    `;
                }

            } catch (err) {
                statusDiv.className = "box error";
                statusDiv.innerHTML = `<h3>❌ ERROR FATAL</h3><p>${err.message}</p>`;
            }
        }

        checkConnection();
    </script>
</body>
</html>
