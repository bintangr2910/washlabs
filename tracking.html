<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Antrian | WashLabs.ind</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="style.css" />

    <!-- CSS Tracking -->
    <link rel="stylesheet" href="tracking.css" />

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">WASHLABS.<span>LIVE</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="btn" style="background: transparent; border: 1px solid var(--accent); color: var(--accent);">Kembali ke Home</a></li>
            </ul>
        </nav>
    </header>

    <!-- Konten Utama -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">📋 Daftar Antrian</h2>
            <p class="section-subtitle">Pantau status pengerjaan secara real-time. Data diperbarui otomatis.</p>

            <!-- Tabel -->
            <div class="queue-container">
                <!-- Tabel -->
<div class="queue-container">
    <table class="queue-table">
        <thead>
            <tr>
                <th>Nama </th>
                <th>Barang</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="queueList">
            <tr>
                <td colspan="3" class="loading-text">
                    Sedang memuat data... ⏳
                </td>
            </tr>
        </tbody>
    </table>
</div>

<p style="margin-top:20px; font-size:0.9rem; color:var(--gray); text-align:center;">
    * Halaman diperbarui otomatis setiap 15 detik.
</p>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2025 WashLabs.indonesia</p>
    </footer>

    <!-- SCRIPT TRACKING -->
    <script src="script.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const db = window.supabaseClient; 
    const tbody = document.getElementById('queueList');

    if (!db) {
        tbody.innerHTML = `
            <tr>
                <td colspan="3" class="loading-text" style="color:#ef4444;">
                    Gagal terhubung ke database.
                </td>
            </tr>
        `;
        return;
    }

    async function fetchQueue() {
        try {
            const { data, error } = await db
                .from('orders')
                .select('nama, barang, jumlah, status')
                .order('id', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="loading-text">
                            Belum ada antrian saat ini.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(item => {
                let badgeClass = "status-antri";
                let icon = "⏳";

                if (item.status === "Sedang Dicuci") {
                    badgeClass = "status-cuci";
                    icon = "🫧";
                } else if (item.status === "Selesai") {
                    badgeClass = "status-selesai";
                    icon = "✅";
                }

                return `
                    <tr>
                        <td style="font-weight:500;">${item.nama}</td>
                        <td>${item.barang} (${item.jumlah})</td>
                        <td>
                            <span class="badge ${badgeClass}">
                                ${icon} ${item.status}
                            </span>
                        </td>
                    </tr>
                `;
            }).join("");

        } catch (err) {
            console.error(err);
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="loading-text" style="color:#ef4444;">
                        Terjadi kesalahan saat memuat data.
                    </td>
                </tr>
            `;
        }
    }

    fetchQueue();
    setInterval(fetchQueue, 15000);
});
</script>
