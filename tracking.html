<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracking Pesanan | WashLabs</title>
  <link rel="stylesheet" href="tracking.css">
</head>
<body>

<div class="container">
  <h1>📦 Tracking Pesanan — WashLabs</h1>
  <p style="text-align:center; margin-bottom:10px;">Cek status proses pencucian barang Anda.</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Cari nama pelanggan..." onkeyup="filterTable()">
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis Barang</th>
          <th>Jumlah</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="orderTable">
        <tr>
          <td colspan="4">Memuat data...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let orderList = []; // akan berisi hasil load API

// ===============================
// LOAD LIST PESANAN (READ ONLY)
// ===============================
async function loadOrders() {
  const table = document.getElementById("orderTable");

  // Menggunakan URL API lokal
  const res = await fetch("http://localhost:3000/api/orders");
  const data = await res.json();

  orderList = data; // simpan untuk fitur filter
  renderTable(orderList);
}

// ===============================
// RENDER TABEL
// ===============================
function renderTable(list) {
  const table = document.getElementById("orderTable");
  table.innerHTML = "";

  if (list.length === 0) {
    table.innerHTML = "<tr><td colspan='4'>Tidak ada data ditemukan.</td></tr>";
    return;
  }

  list.forEach(order => {
    let statusClass;
    if (order.status === "Selesai") statusClass = "finished";
    else if (order.status === "Sedang dicuci") statusClass = "cleaning";
    else if (order.status === "Pengeringan") statusClass = "drying";
    else statusClass = "pending";

    table.innerHTML += `
      <tr>
        <td>${order.name}</td>
        <td>${order.item}</td>
        <td>${order.quantity}</td>
        <td><span class="status ${statusClass}">${order.status}</span></td>
      </tr>
    `;
  });
}

// ===============================
// FILTER BERDASARKAN NAMA
// ===============================
function filterTable() {
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const filtered = orderList.filter(order =>
    order.name.toLowerCase().includes(keyword)
  );
  renderTable(filtered);
}

// Auto-refresh setiap 5 detik
loadOrders();
setInterval(loadOrders, 5000);
</script>

</body>
</html>
